[project]
name = "rtsynth"
version = "0.0.1"
description = "Synthetic defective weld radiographs: physics-informed compositing and inpainting augmentation"
requires-python = "==3.12.*"
dependencies = [
    "imagecodecs==2026.8.16",
    "matplotlib==3.11.2",
    "numpy==2.5.3",
    "opencv-python-headless==5.0.0.93",
    "tifffile==2026.9.20",
]

[tool.ruff]
line-length = 100
target-version = "py312"
